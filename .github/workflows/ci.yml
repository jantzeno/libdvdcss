name: C++23

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Meson and Ninja
        run: python -m pip install "meson>=1.3" ninja
      - name: Configure
        run: meson setup build -Dwerror=true -Denable_examples=true
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  clang:
    runs-on: ubuntu-24.04
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-19 meson ninja-build
      - name: Configure
        run: meson setup build -Dwerror=true -Denable_examples=true
      - name: Build and test
        run: meson test -C build --print-errorlogs

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      CC: clang-19
      CXX: clang++-19
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-19 libclang-rt-19-dev meson ninja-build
      - name: Configure
        run: >-
          meson setup build -Dbuildtype=debug
          -Db_sanitize=address,undefined -Db_lundef=false
      - name: Build and test
        run: meson test -C build --print-errorlogs

  mingw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y g++-mingw-w64-x86-64 meson ninja-build
      - name: Configure
        run: >-
          meson setup build
          --cross-file package/crossfiles/x86_64-w64-mingw32.meson
          -Dwerror=true -Denable_examples=true
      - name: Cross-build
        run: meson compile -C build
