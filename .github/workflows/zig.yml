name: Zig

"on":
  push:
    branches:
      - zig
      - "repair/**"
  pull_request:
    branches:
      - zig

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Build and run smoke test
        run: zig build test -Dwarnings-as-errors=true --summary all

      - name: Build shared library
        run: zig build -Dlinkage=dynamic -Dwarnings-as-errors=true --summary all

      - name: Verify shared-library exports
        if: runner.os == 'Linux'
        run: sh test/check_exports.sh

      - name: Build example
        run: zig build -Dexamples=true -Dwarnings-as-errors=true --summary all
